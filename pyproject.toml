[project]
name = "lsp-proxy"
version = "0.1.0"
description = "A tiny LSP proxy that dumps the JSON-RPC traffic between an editor and a language server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aurora0x27" }]
keywords = ["lsp", "language-server", "debugging", "neovim"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Text Editors",
]
dependencies = []

[project.scripts]
lsp-proxy = "lsp_proxy.cli:main"

[project.urls]
Source = "https://github.com/aurora0x27/lsp-proxy"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsp_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
